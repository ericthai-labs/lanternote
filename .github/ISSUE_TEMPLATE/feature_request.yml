name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work? Mock-ups and examples are welcome.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Alternatives you tried, how often you would use it, how large your folder is.
