name: Test, build and release

# Every push and pull request: tests on Windows, macOS and Linux, then builds for all three.
# A version tag (v1.2.3) also makes the GitHub release by itself once all of that passed:
# Windows .exe + .zip, macOS .zip, Linux .AppImage, the Claude Desktop extension (.mcpb),
# notes from CHANGELOG.md — and publishes the new version to the MCP Registry.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Make (or refresh) the release for this existing tag, e.g. v1.18.0; empty = test and build only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: AI connection (MCP)
        run: node tests/mcp.js
      - name: Index cache
        run: node tests/index-cache.js
      - name: UI scenarios (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a -s "-screen 0 1600x1000x24" node tests/run-all.js
      - name: UI scenarios
        if: runner.os != 'Linux'
        run: node tests/run-all.js

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
          - os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --publish never: electron-builder would try to upload by itself on a tag; the step below does it
      - run: npm run ${{ matrix.dist }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: lanternote-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # MCP Registry login (GitHub OIDC)
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag matches package.json and CHANGELOG.md
        run: |
          v=$(node -p "require('./package.json').version")
          [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG but package.json says $v"; exit 1; }
          node scripts/release-notes.js "$v" > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: lanternote-*
          merge-multiple: true
      - name: Claude Desktop extension (.mcpb) and server.json
        run: node scripts/make-mcpb.js dist
      - name: Make or update the release
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.zip dist/*.AppImage dist/*.mcpb)
          ls -l "${files[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "Lanternote ${TAG#v}" --notes-file notes.md
          fi
      # server.json was just written for the bundle uploaded above, so the registry check matches
      - name: Publish to the MCP Registry
        run: |
          curl -sfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
